server:
  port: 8080

spring:
  application:
    name: study-room-system

  datasource:
    url: jdbc:mysql://localhost:3306/study_room_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.example.studyroom.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.studyroom.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    configuration:
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发环境打印SQL，生产环境可移除

# JWT 配置（生产环境请通过环境变量 JWT_SECRET / JWT_EXPIRATION 覆盖）
jwt:
  secret: ${JWT_SECRET:study-room-secret-key-2026-08-18-change-me-in-production-0123456789abcdef}
  expiration: ${JWT_EXPIRATION:86400000}

# 密码强度配置（与 PasswordValidator 联动）
password:
  min-length: 8
  require-special-char: true
  require-upper-lower: true

# CORS 允许来源（逗号分隔），生产环境请改为正式前端域名
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5137}

logging:
  level:
    root: info
    com.example.studyroom: debug